<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سقوط – هزارتوی پول</title>
  <style>
    @font-face {
      font-family: 'BKoodak';
      src: url('https://cdnjs.cloudflare.com/ajax/libs/fonts-persian/1.0.0/BKoodak.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'BKoodak', 'Tahoma', sans-serif;
      background: linear-gradient(135deg, #f5f0e5 0%, #e8e0d5 100%);
      min-height: 100vh;
      color: #453c36;
      line-height: 1.6;
      direction: rtl;
      text-align: right;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      position: relative;
    }
    
    h1 {
      text-align: center;
      color: #6d4c41;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    
    h2 {
      color: #5d4037;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }
    
    p {
      margin-bottom: 18px;
      font-size: 1.2rem;
    }
    
    input[type="text"],
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      font-family: 'BKoodak', 'Tahoma', sans-serif;
      font-size: 1.1rem;
      direction: rtl;
    }
    
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin: 15px 0;
      background: linear-gradient(135deg, #8d6e63 0%, #6d4c41 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'BKoodak', 'Tahoma', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    
    .btn:hover {
      background: linear-gradient(135deg, #a1887f 0%, #8d6e63 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .fade-in {
      animation: fadeIn 0.6s ease-in;
    }
    
    .slide-in {
      animation: slideIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .scene-content {
      min-height: 300px;
      margin-bottom: 20px;
    }
    
    .ending-container {
      text-align: center;
      padding: 30px 0;
    }
    
    .attributes {
      display: none;
    }
    
    .persona {
      font-size: 2rem;
      color: #6d4c41;
      margin: 20px 0;
      text-align: center;
    }
    
    .restart-btn {
      background: linear-gradient(135deg, #d7ccc8 0%, #bcaaa4 100%);
      color: #5d4037;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      h2 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 1.1rem;
      }
      
      .btn {
        padding: 12px 16px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container fade-in" id="game-container">
    <h1>سقوط – هزارتوی پول</h1>
    <div id="game-content">
      <!-- Initial welcome screen -->
      <div id="welcome-screen">
        <p>به بازی «سقوط – هزارتوی پول» خوش آمدید. در این سفر، شما با تصمیم‌هایی مواجه می‌شوید که روی سرنوشت مالی و شخصی شما تأثیر می‌گذارند.</p>
        <p>لطفاً قبل از شروع، اطلاعات زیر را وارد کنید:</p>
        
        <label for="age">سن:</label>
        <input type="text" id="age" placeholder="سن خود را وارد کنید">
        
        <label for="gender">جنسیت:</label>
        <select id="gender">
          <option value="">انتخاب کنید</option>
          <option value="مرد">مرد</option>
          <option value="زن">زن</option>
          <option value="سایر">سایر</option>
          <option value="ترجیح می‌دهم نگویم">ترجیح می‌دهم نگویم</option>
        </select>
        
        <button class="btn" id="start-game">شروع بازی</button>
      </div>
      
      <!-- Game screen (initially hidden) -->
      <div id="game-screen" style="display: none;">
        <div class="scene-content" id="scene-content"></div>
        <div id="choices-container"></div>
      </div>
      
      <!-- Hidden attributes tracking -->
      <div class="attributes">
        <span id="impulsivity">0</span>
        <span id="morality">0</span>
        <span id="creativity">0</span>
        <span id="clarity">0</span>
      </div>
    </div>
  </div>

  <script>
    // DOM elements
    const welcomeScreen = document.getElementById("welcome-screen");
    const gameScreen = document.getElementById("game-screen");
    const startButton = document.getElementById("start-game");
    const sceneContent = document.getElementById("scene-content");
    const choicesContainer = document.getElementById("choices-container");
    
    // Initialize game
    document.addEventListener('DOMContentLoaded', function() {
      startButton.addEventListener('click', startGame);
    });
    
    // Start game function
    function startGame() {
      const age = document.getElementById("age").value;
      const gender = document.getElementById("gender").value;
      
      if (!age || !gender) {
        alert("لطفاً سن و جنسیت خود را وارد کنید.");
        return;
      }
      
      // Set player information
      gameData.player.age = age;
      gameData.player.gender = gender;
      
      // Hide welcome screen, show game screen
      welcomeScreen.style.display = "none";
      gameScreen.style.display = "block";
      
      // Load first scene
      loadScene("start");
    }
    
    // Load scene function
    function loadScene(sceneId) {
      const scene = gameData.scenes[sceneId];
      
      if (!scene) {
        console.error("Scene not found: " + sceneId);
        return;
      }
      
      // Record path
      gameData.player.path.push(sceneId);
      
      // Update scene content
      sceneContent.innerHTML = `<h2>${scene.title}</h2>${scene.content}`;
      sceneContent.classList.add("slide-in");
      
      // Clear choices container
      choicesContainer.innerHTML = "";
      
      // If this is an ending scene
      if (scene.isEnding) {
        // Add persona and ending type
        const persona = calculatePersona();
        const endingType = calculateEnding();
        sceneContent.innerHTML += `
          <div class="persona">شخصیت شما: ${persona}</div>
          <div class="ending-type">نوع پایان: ${endingType}</div>
        `;
        
        // Add restart button
        const restartButton = document.createElement("button");
        restartButton.className = "btn restart-btn";
        restartButton.textContent = "شروع مجدد بازی";
        restartButton.addEventListener("click", function() {
          // Reset player data
          gameData.player = {
            age: gameData.player.age,
            gender: gameData.player.gender,
            impulsivity: 0,
            morality: 0,
            creativity: 0,
            clarity: 0,
            path: []
          };
          
          // Load first scene
          loadScene("start");
        });
        
        choicesContainer.appendChild(restartButton);
        return;
      }
      
      // For non-ending scenes, create choice buttons
      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "btn";
        button.textContent = choice.text;
        
        button.addEventListener("click", function() {
          // Update attributes
          if (choice.attributes) {
            for (const [attr, value] of Object.entries(choice.attributes)) {
              gameData.player[attr] += value;
            }
          }
          
          // Load next scene
          loadScene(choice.nextScene);
        });
        
        choicesContainer.appendChild(button);
      });
    }
    
    // Calculate personality type based on attributes
    function calculatePersona() {
      const { impulsivity, morality, creativity, clarity } = gameData.player;
      
      if (impulsivity > 5 && clarity < 0) {
        return "آتش‌افروز";
      } else if (morality > 5 && clarity > 3) {
        return "هوشیار";
      } else if (creativity > 5 && morality > 0) {
        return "بذرکار";
      } else if (clarity > 5 && impulsivity < 0) {
        return "ناظر";
      } else {
        return "عابر";
      }
    }
    
    // Calculate ending based on attributes and path
    function calculateEnding() {
      const { morality, clarity } = gameData.player;
      
      if (clarity < 0) {
        return "مه‌آلود";
      } else if (morality > 5) {
        return "سخاوتمند";
      } else if (morality < -3) {
        return "سودجو";
      } else if (clarity > 5) {
        return "بصیر";
      } else {
        return "متعادل";
      }
    }
    
    // Game data structure
    const gameData = {
      // Player information
      player: {
        age: null,
        gender: null,
        impulsivity: 0,
        morality: 0,
        creativity: 0,
        clarity: 0,
        path: []
      },
      
      // Game scenes
      scenes: {
        // Level 1: The Beginning
        "start": {
          title: "کشف غیرمنتظره",
          content: `<p>شما در مسیر همیشگی بازگشت از محل کار، از کنار یک کوچه‌ی باریک عبور می‌کنید. ناگهان صدایی آشنا توجه‌تان را جلب می‌کند. صدای افتادن چیزی فلزی روی زمین.</p>
          <p>با کنجکاوی وارد کوچه می‌شوید و در گوشه‌ای تاریک، کیف چرمی قدیمی‌ای را می‌بینید. کیف نیمه‌باز است و محتویات آن به بیرون ریخته. با نزدیک شدن، چشمانتان گرد می‌شود. بسته‌های اسکناس...</p>
          <p>قلبتان به شدت می‌تپد. اطراف را نگاه می‌کنید. هیچ‌کس در کوچه نیست. با خودتان فکر می‌کنید: «این پول از کجا آمده؟ صاحبش کجاست؟»</p>`,
          choices: [
            {
              text: "کیف و تمام پول‌ها را برداشته و سریع از آنجا دور شوید",
              nextScene: "take_all",
              attributes: { impulsivity: 2, morality: -2, clarity: -1 }
            },
            {
              text: "کیف را بررسی کنید تا مشخصات صاحب آن را پیدا کنید",
              nextScene: "check_owner",
              attributes: { impulsivity: -1, morality: 2, clarity: 1 }
            },
            {
              text: "مقداری از پول را بردارید و بقیه را همانجا رها کنید",
              nextScene: "take_some",
              attributes: { impulsivity: 1, morality: -1, creativity: 1 }
            }
          ]
        },
        
        // Level 1: Branches
        "take_all": {
          title: "تصمیم سریع",
          content: `<p>با دستانی لرزان، کیف و تمام پول‌ها را برمی‌دارید. حجم پول بیشتر از آن چیزی است که تصور می‌کردید. هیجان و ترس همزمان وجودتان را فرا می‌گیرد.</p>
          <p>در حالی که به سرعت از کوچه خارج می‌شوید، صدایی در ذهنتان تکرار می‌شود: «این کار درست است؟» اما فکر پول‌های داخل کیف، وسوسه‌انگیزتر از هر چیز دیگری است.</p>
          <p>به خانه که می‌رسید، در را قفل می‌کنید و محتویات کیف را روی میز می‌ریزید. علاوه بر پول‌ها، یک دفترچه کوچک، یک کلید و یک کارت ویزیت داخل کیف است. کارت متعلق به شرکتی است با نام «سرمایه‌گذاری آینده‌نگر».</p>`,
          choices: [
            {
              text: "پول‌ها را پنهان کنید و به کارت و دفترچه توجهی نکنید",
              nextScene: "hide_money",
              attributes: { impulsivity: 1, clarity: -2 }
            },
            {
              text: "دفترچه را بررسی کنید تا اطلاعات بیشتری به دست آورید",
              nextScene: "check_notebook",
              attributes: { clarity: 2, creativity: 1 }
            },
            {
              text: "به آدرس روی کارت ویزیت بروید تا بفهمید ماجرا چیست",
              nextScene: "visit_company",
              attributes: { impulsivity: -1, creativity: 2, clarity: 1 }
            }
          ]
        },
        
        "check_owner": {
          title: "جستجوی صاحب",
          content: `<p>با احتیاط کیف را باز می‌کنید. علاوه بر بسته‌های پول، یک کارت شناسایی، چند کارت ویزیت و یک کلید داخل آن است. کارت شناسایی متعلق به آقای «سهراب معینی» است، مدیرعامل شرکت «سرمایه‌گذاری آینده‌نگر».</p>
          <p>روی یکی از کارت‌های ویزیت، شماره تلفن همراهی نوشته شده است. با تردید به شماره نگاه می‌کنید. پول زیادی داخل کیف است، شاید بیش از صد میلیون تومان.</p>
          <p>صدای پایی از انتهای کوچه به گوش می‌رسد. تصمیم سختی پیش روی شماست.</p>`,
          choices: [
            {
              text: "با شماره روی کارت تماس بگیرید",
              nextScene: "call_owner",
              attributes: { morality: 2, impulsivity: -1 }
            },
            {
              text: "کیف را با خود ببرید و بعداً تصمیم بگیرید",
              nextScene: "take_decide_later",
              attributes: { morality: -1, clarity: -1, impulsivity: 1 }
            },
            {
              text: "کیف را به نزدیک‌ترین کلانتری تحویل دهید",
              nextScene: "police_station",
              attributes: { morality: 3, clarity: 1, impulsivity: -2 }
            }
          ]
        },
        
        "take_some": {
          title: "معامله با وجدان",
          content: `<p>با خودتان کلنجار می‌روید. شاید برداشتن همه پول کار درستی نباشد، اما چرا کمی از آن سهم شما نباشد؟</p>
          <p>با دستانی لرزان، چند بسته اسکناس را برمی‌دارید و در جیب می‌گذارید. حدود بیست میلیون تومان. مابقی پول‌ها را داخل کیف می‌گذارید و کیف را همانجا رها می‌کنید.</p>
          <p>در حال دور شدن از محل، احساسات متناقضی دارید. از یک طرف، خوشحالید که پولی ناگهانی نصیبتان شده، از طرف دیگر، عذاب وجدان رهایتان نمی‌کند.</p>`,
          choices: [
            {
              text: "پول را خرج نیازهای ضروری خود کنید",
              nextScene: "spend_needs",
              attributes: { morality: -1, clarity: 1 }
            },
            {
              text: "برگردید و کیف را هم بردارید",
              nextScene: "go_back_take_all",
              attributes: { impulsivity: 2, morality: -2 }
            },
            {
              text: "پول را در محلی امن پنهان کنید و منتظر بمانید",
              nextScene: "hide_wait",
              attributes: { clarity: -1, creativity: 1 }
            }
          ]
        },

        // Level 2: Branches from take_all
        "hide_money": {
          title: "پول‌های پنهان",
          content: `<p>تصمیم می‌گیرید پول‌ها را پنهان کنید و به بقیه محتویات کیف توجهی نکنید. چه اهمیتی دارد این پول از کجا آمده؟ الان مال شماست.</p>
          <p>پول‌ها را می‌شمارید. حدود ۱۲۰ میلیون تومان است. مبلغی که می‌تواند زندگی‌تان را تغییر دهد.</p>
          <p>شب هنگام، صدای زنگ تلفن همراهتان شما را از خواب می‌پراند. شماره‌ای ناشناس است. با تردید پاسخ می‌دهید.</p>
          <p>صدایی خشن می‌گوید: «می‌دونم کیف رو تو برداشتی. فردا ساعت ۱۰ صبح، پارک سروناز، نیمکت آخر. تنها بیا.»</p>`,
          choices: [
            {
              text: "به قرار بروید و کیف را برگردانید",
              nextScene: "return_briefcase",
              attributes: { morality: 1, impulsivity: -1, clarity: 1 }
            },
            {
              text: "به قرار نروید و پول‌ها را نگه دارید",
              nextScene: "keep_money_danger",
              attributes: { impulsivity: 1, morality: -2, clarity: -1 }
            },
            {
              text: "با پلیس تماس بگیرید و ماجرا را تعریف کنید",
              nextScene: "call_police_scared",
              attributes: { morality: 2, clarity: 2, impulsivity: -1 }
            }
          ]
        },
        
        "check_notebook": {
          title: "راز دفترچه",
          content: `<p>کنجکاوی بر ترستان غلبه می‌کند. دفترچه را باز می‌کنید. صفحات آن پر است از اعداد، کدها و یادداشت‌های کوتاه. به نظر می‌رسد این دفترچه حاوی اطلاعاتی درباره معاملات مالی مشکوک است.</p>
          <p>در یکی از صفحات، نقشه‌ای کوچک با آدرسی در حاشیه شهر رسم شده و زیر آن نوشته شده: «محل نگهداری اسناد اصلی - ۱۲ اردیبهشت - ساعت ۲۳»</p>
          <p>امروز ۱۱ اردیبهشت است. یعنی این قرار برای فرداست؟</p>
          <p>ناگهان تلفن همراهتان زنگ می‌خورد. شماره‌ای ناشناس. قلبتان به شدت می‌تپد.</p>`,
          choices: [
            {
              text: "پاسخ دهید و خودتان را به نام صاحب کیف معرفی کنید",
              nextScene: "answer_pretend",
              attributes: { creativity: 2, impulsivity: 1, morality: -1 }
            },
            {
              text: "به آدرس نوشته شده در دفترچه بروید",
              nextScene: "go_to_address",
              attributes: { clarity: 1, creativity: 1, impulsivity: 1 }
            },
            {
              text: "پول‌ها را بردارید و دفترچه و کیف را جایی رها کنید",
              nextScene: "abandon_evidence",
              attributes: { clarity: -1, morality: -1 }
            }
          ]
        },
        
        "visit_company": {
          title: "شرکت مرموز",
          content: `<p>فردا صبح به آدرس روی کارت ویزیت می‌روید. «شرکت سرمایه‌گذاری آینده‌نگر» در طبقه دهم یک برج تجاری مدرن قرار دارد.</p>
          <p>با تردید وارد دفتر شرکت می‌شوید. منشی با دیدن شما لبخند می‌زند: «بفرمایید، چطور می‌تونم کمکتون کنم؟»</p>
          <p>قبل از اینکه فرصت توضیح پیدا کنید، مردی میانسال با کت و شلوار شیک از اتاقی بیرون می‌آید. با دیدن کیف در دست شما، چشمانش برق می‌زند.</p>
          <p>«به به، شما باید فرشته نجات من باشید! من سهراب معینی هستم. اون کیف من بود که دیروز گم کردم.»</p>`,
          choices: [
            {
              text: "کیف را به او بدهید و درباره پول‌ها چیزی نگویید",
              nextScene: "return_quietly",
              attributes: { morality: -2, clarity: -1 }
            },
            {
              text: "حقیقت را بگویید و اعتراف کنید که پول‌ها را دیده‌اید",
              nextScene: "tell_truth",
              attributes: { morality: 2, clarity: 2, impulsivity: -1 }
            },
            {
              text: "بپرسید این مبلغ زیاد پول برای چه کاری استفاده می‌شود",
              nextScene: "question_money",
              attributes: { clarity: 1, creativity: 1 }
            }
          ]
        },

        // Level 2: Branches from check_owner
